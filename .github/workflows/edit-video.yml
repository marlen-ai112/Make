name: Edit video

on:
  schedule:
    - cron: '*/30 * * * *'
  push:
    paths: ['jobs/**']
  workflow_dispatch:
    inputs:
      job:
        description: 'Необязательно: путь к файлу задания в репозитории'
        required: false

concurrency:
  group: edit-video
  cancel-in-progress: false

jobs:
  edit:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Install ffmpeg, fonts and rclone
        run: |
          for i in 1 2 3; do
            sudo apt-get update && sudo apt-get install -y --fix-missing -o Acquire::Retries=3 ffmpeg fonts-dejavu-core && break
            echo "apt не сработал, попытка $i, жду 20 секунд"
            sleep 20
          done
          command -v ffmpeg || { echo "ffmpeg не установился"; exit 1; }
          curl -fsSL https://rclone.org/install.sh | sudo bash

      - name: Configure rclone
        env:
          RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
        run: |
          mkdir -p ~/.config/rclone
          printf '%s\n' "$RCLONE_CONF" > ~/.config/rclone/rclone.conf

      - name: Run jobs
        env:
          JOB: ${{ github.event.inputs.job }}
          EVENT: ${{ github.event_name }}
        run: |
          FILES=""
          if [ "$EVENT" = "push" ]; then
            FILES=$(git diff --name-only --diff-filter=AM HEAD~1 HEAD -- 'jobs/*.json' || true)
          fi
          if [ -n "$JOB" ]; then FILES="$JOB"; fi
          python3 scripts/edit.py --drive $FILES
